services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: seh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seh_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-seh_demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seh_user} -d ${POSTGRES_DB:-seh_demo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seh-network
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # Backend NestJS
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: seh-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-seh_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-seh_demo}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-30d}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      STORAGE_TYPE: local
      UPLOAD_DIR: ./uploads
      WEBP_QUALITY: ${WEBP_QUALITY:-82}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-40000000}
      MAX_IMAGE_PROCESSING_CONCURRENCY: ${MAX_IMAGE_PROCESSING_CONCURRENCY:-1}
      SHARP_CONCURRENCY: ${SHARP_CONCURRENCY:-1}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - seh-network
    expose:
      - "3000"
    volumes:
      - seh_uploads:/app/uploads
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # Frontend Web React
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: seh-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - seh-network
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m

  # Terminación TLS y único punto de entrada público.
  caddy:
    profiles:
      - bundled-caddy
    image: caddy:2.8-alpine
    container_name: seh-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - seh-network
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # Adminer - Administrador de base de datos (opcional, para desarrollo)
  adminer:
    image: adminer:latest
    container_name: seh-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      - postgres
    networks:
      - seh-network
    profiles:
      - dev

volumes:
  postgres_data:
    driver: local
  seh_uploads:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  seh-network:
    driver: bridge
