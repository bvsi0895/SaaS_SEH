version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: seh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seh_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seh_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-seh_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seh_user} -d ${POSTGRES_DB:-seh_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seh-network

  # Backend NestJS
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seh-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-seh_user}:${POSTGRES_PASSWORD:-seh_password_123}@postgres:5432/${POSTGRES_DB:-seh_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - seh-network

  # Frontend Web React
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    container_name: seh-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - seh-network

  # Adminer - Administrador de base de datos (opcional, para desarrollo)
  adminer:
    image: adminer:latest
    container_name: seh-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - seh-network
    profiles:
      - dev

volumes:
  postgres_data:
    driver: local

networks:
  seh-network:
    driver: bridge
