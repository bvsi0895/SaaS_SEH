name: Inspection delegation PostgreSQL 16

on:
  pull_request:
    branches:
      - feature/demo-online
    paths:
      - "backend/**"
      - "web/**"
      - "tests/contracts/**"
      - ".github/workflows/inspection-delegation-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://seh_pr12:seh_pr12_password@localhost:5432/seh_pr12?schema=public

jobs:
  postgres-16:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seh_pr12
          POSTGRES_PASSWORD: seh_pr12_password
          POSTGRES_DB: seh_pr12
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U seh_pr12 -d seh_pr12"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma validate and generate
        run: |
          pnpm --filter seh-backend exec prisma validate
          pnpm --filter seh-backend exec prisma generate
      - name: Apply current migrations
        run: pnpm --filter seh-backend exec prisma migrate deploy
      - name: Run Jest
        run: pnpm --filter seh-backend test -- --runInBand
      - name: Run backend build
        run: pnpm --filter seh-backend build
      - name: Run frontend typecheck and build
        run: pnpm --filter seh-web build
      - name: Run contract tests
        run: node --test tests/contracts/*.mjs
      - name: Run PostgreSQL delegation integration
        run: pnpm --filter seh-backend exec ts-node --transpile-only integration/inspection-delegation-postgres.integration.ts
      - name: Run PostgreSQL checklist library integration
        run: pnpm --filter seh-backend exec ts-node --transpile-only integration/checklists-library-postgres.integration.ts
      - name: Run PostgreSQL technician authorization integration
        run: pnpm --filter seh-backend exec ts-node --transpile-only integration/technician-permissions-postgres.integration.ts
      - name: Run PostgreSQL dashboard integration
        run: pnpm --filter seh-backend exec ts-node --transpile-only integration/dashboard-postgres.integration.ts
      - name: Run PR #28 multi-company isolation integration
        run: pnpm --filter seh-backend run test:multitenant:pr28
      - name: Start backend HTTP for logout token revocation
        env:
          DATABASE_URL: postgresql://seh_pr12:seh_pr12_password@localhost:5432/seh_pr12?schema=public
          JWT_SECRET: logout-token-revocation-test-secret
          JWT_REFRESH_SECRET: logout-token-revocation-test-refresh-secret
          JWT_EXPIRATION: 1h
          JWT_REFRESH_EXPIRATION: 7d
          CORS_ORIGIN: http://localhost:5173
          PORT: 3000
        shell: bash
        run: |
          set -euo pipefail
          nohup node backend/dist/main.js >/tmp/seh-backend-logout.log 2>&1 &
          echo "$!" >/tmp/seh-backend-logout.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/seh-backend-logout.log
          exit 1
      - name: Run logout token revocation integration
        env:
          DATABASE_URL: postgresql://seh_pr12:seh_pr12_password@localhost:5432/seh_pr12?schema=public
          SEH_E2E_BASE_URL: http://127.0.0.1:3000/api
          NODE_ENV: test
        run: pnpm --filter seh-backend exec ts-node --transpile-only integration/logout-token-revocation-postgres.integration.ts
      - name: Stop backend HTTP for logout token revocation
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/seh-backend-logout.pid ]]; then
            pid="$(cat /tmp/seh-backend-logout.pid)"
            kill "$pid" 2>/dev/null || true
            for attempt in {1..10}; do
              if ! kill -0 "$pid" 2>/dev/null; then
                exit 0
              fi
              sleep 1
            done
            kill -9 "$pid" 2>/dev/null || true
          fi

  migration-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seh_pr12_migration
          POSTGRES_PASSWORD: seh_pr12_migration_password
          POSTGRES_DB: seh_pr12_migration
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U seh_pr12_migration -d seh_pr12_migration"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: postgresql://seh_pr12_migration:seh_pr12_migration_password@localhost:5433/seh_pr12_migration?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter seh-backend exec prisma generate
      - name: Apply pre-delegation migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/seh-pr12-new-migrations
          mv backend/prisma/migrations/20261117090000_add_pending_inspection_status /tmp/seh-pr12-new-migrations/
          mv backend/prisma/migrations/20261117100000_inspection_delegation /tmp/seh-pr12-new-migrations/
          mv backend/prisma/migrations/20261117110000_pending_inspection_start_date /tmp/seh-pr12-new-migrations/
          mv backend/prisma/migrations/20261125120000_migrate_legacy_checklist_ids /tmp/seh-pr12-new-migrations/
          mv backend/prisma/migrations/20261125150000_checklists_library_by_organization /tmp/seh-pr12-new-migrations/
          pnpm --filter seh-backend exec prisma migrate deploy
          mv /tmp/seh-pr12-new-migrations/20261117090000_add_pending_inspection_status backend/prisma/migrations/
          mv /tmp/seh-pr12-new-migrations/20261117100000_inspection_delegation backend/prisma/migrations/
          mv /tmp/seh-pr12-new-migrations/20261117110000_pending_inspection_start_date backend/prisma/migrations/
      - name: Seed legacy inspection before PR #12
        run: psql "postgresql://seh_pr12_migration:seh_pr12_migration_password@localhost:5433/seh_pr12_migration" --file=backend/integration/legacy-inspection-seed.sql
      - name: Apply delegation migrations and verify preservation
        run: |
          pnpm --filter seh-backend exec prisma migrate deploy
          psql "postgresql://seh_pr12_migration:seh_pr12_migration_password@localhost:5433/seh_pr12_migration" --file=backend/integration/legacy-checklist-migration-seed.sql
          mv /tmp/seh-pr12-new-migrations/20261125120000_migrate_legacy_checklist_ids backend/prisma/migrations/
          pnpm --filter seh-backend exec prisma migrate deploy
          mv /tmp/seh-pr12-new-migrations/20261125150000_checklists_library_by_organization backend/prisma/migrations/
          pnpm --filter seh-backend exec prisma migrate deploy
          pnpm --filter seh-backend exec ts-node --transpile-only integration/verify-inspection-delegation-migration.ts
          pnpm --filter seh-backend exec ts-node --transpile-only integration/verify-legacy-checklist-migration.ts

  migration-ambiguous-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seh_pr32_ambiguous
          POSTGRES_PASSWORD: seh_pr32_ambiguous_password
          POSTGRES_DB: seh_pr32_ambiguous
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U seh_pr32_ambiguous -d seh_pr32_ambiguous"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: postgresql://seh_pr32_ambiguous:seh_pr32_ambiguous_password@localhost:5434/seh_pr32_ambiguous?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter seh-backend exec prisma generate
      - name: Apply migrations before checklist library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/seh-pr32-ambiguous-migrations
          mv backend/prisma/migrations/20261125120000_migrate_legacy_checklist_ids /tmp/seh-pr32-ambiguous-migrations/
          mv backend/prisma/migrations/20261125150000_checklists_library_by_organization /tmp/seh-pr32-ambiguous-migrations/
          pnpm --filter seh-backend exec prisma migrate deploy
          mv /tmp/seh-pr32-ambiguous-migrations/20261125150000_checklists_library_by_organization backend/prisma/migrations/
      - name: Seed ambiguous ownership fixture
        run: psql "postgresql://seh_pr32_ambiguous:seh_pr32_ambiguous_password@localhost:5434/seh_pr32_ambiguous" --file=backend/integration/ambiguous-checklist-ownership-seed.sql
      - name: Reject ambiguous checklist ownership atomically
        shell: bash
        run: |
          set -euo pipefail
          set +e
          psql "postgresql://seh_pr32_ambiguous:seh_pr32_ambiguous_password@localhost:5434/seh_pr32_ambiguous" --set ON_ERROR_STOP=1 --single-transaction --file=backend/prisma/migrations/20261125150000_checklists_library_by_organization/migration.sql
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "La migración debía rechazar la propiedad ambigua"
            exit 1
          fi
          checklist_count="$(psql "postgresql://seh_pr32_ambiguous:seh_pr32_ambiguous_password@localhost:5434/seh_pr32_ambiguous" --tuples-only --no-align --command="SELECT count(*) FROM checklists WHERE id = '00000000-0000-4000-8000-000000000806';")"
          if [[ "$checklist_count" != "1" ]]; then
            echo "La reversión transaccional no preservó el checklist legacy"
            exit 1
          fi
          organization_column_count="$(psql "postgresql://seh_pr32_ambiguous:seh_pr32_ambiguous_password@localhost:5434/seh_pr32_ambiguous" --tuples-only --no-align --command="SELECT count(*) FROM information_schema.columns WHERE table_name = 'checklists' AND column_name = 'organizacionId';")"
          if [[ "$organization_column_count" != "0" ]]; then
            echo "La migración dejó cambios parciales después de detectar la ambigüedad"
            exit 1
          fi
          echo "La migración rechazó correctamente la propiedad ambigua (status $status)"
