name: E2E Chromium

on:
  pull_request:
    branches:
      - feature/demo-online
    paths:
      - "backend/**"
      - "web/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e-chromium.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build frontend
        run: pnpm --filter seh-web build
      - name: Start frontend
        shell: bash
        run: |
          set -euo pipefail
          nohup pnpm --filter seh-web exec vite --host 127.0.0.1 >/tmp/seh-web-e2e.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/seh-web-e2e.log
          exit 1
      - name: Run all E2E specs on desktop Chromium
        run: pnpm exec playwright test --project=desktop-1440x900
      - name: Run PR #32 responsive regression on mobile Chromium
        run: pnpm exec playwright test tests/e2e/pr32-checklist-library.spec.ts --project=mobile-390x844
